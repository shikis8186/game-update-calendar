# 対象ゲームの一覧です。上から順に、画面のボタンに並びます。
#
#   id         : 内部で使う識別子（英数字）
#   name       : 画面に表示する名前
#   color      : カレンダーの塗りつぶし色
#   text_color : 塗りつぶしの上に載せる文字色
#
# 情報源の指定（ゲームごとに必要なものだけ書きます）
#   [games.steam]     appid       … Steam のアプリID。お知らせとビルド更新を取得します
#   [games.hoyoverse] launcher_id … HoYoPlay（公式ランチャー）のゲームID
#                     hoyolab_gid … HoYoLAB の公式お知らせのゲーム番号
#   [games.lol]       enabled     … LoL 用（公式パッチスケジュール・パッチノート）
#   [games.nikke]     enabled     … NIKKE 用（公式サイトのお知らせ）

